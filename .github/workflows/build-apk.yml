name: Build Android APK (VozMess)

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'build-apk'
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build VozMess Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate brand icons
        run: npm run generate-icons

      - name: Build web application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p build-output
          APK_PATH=$(find android -name "*debug*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android -name "*.apk" -type f | head -n 1)
          fi
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp -v "$APK_PATH" build-output/VozMess.apk
            ls -lh build-output/
          else
            echo "❌ APK file not found!"
            find android -type f
            exit 1
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VozMess-Android-APK
          path: build-output/VozMess.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: android-latest
          name: "VozMess Android App (Latest APK)"
          body: |
            ## 📱 VozMess для Android
            
            Свежая сборка мессенджера VozMess (.apk).
            
            ### Как установить:
            1. Скачайте файл **`VozMess.apk`** ниже на свой Android-смартфон.
            2. Откройте скачанный файл и нажмите **«Установить»** (при необходимости разрешите установку из неизвестных источников в настройках).
            3. Запустите приложение с рабочего стола!
          files: build-output/VozMess.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
